# Dev environment for the payment-gateway package.
# Usage:
#   docker compose build
#   docker compose run --rm app composer install
#   docker compose run --rm app composer ci
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/root/.composer/cache
    # Keep it interactive when you exec a shell.
    tty: true

volumes:
  composer-cache:
